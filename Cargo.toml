[package]
name = "aquarium"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Fond d'écran aquarium pixel art + idle game (Windows)"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mises à jour (GitHub Releases) : HTTPS par rustls (pas d'OpenSSL), empreinte sha256.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
ring = "0.17"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
